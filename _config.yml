title: "Investigating the structure of COVID-19 severity: A donor-level view of single-cell RNA-sequencing data" 
description: "This study investigates whether RNA-sequencing data from COVID-19 patients reflects clinically defined disease severity. Using donor-level pseudobulk profiles, it examines whether severity follows a continuous gradient or distinct stages, highlighting agreements and discrepancies between clinical classifications and molecular patterns." 
